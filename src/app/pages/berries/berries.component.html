
<div class="container mx-auto px-4">
  <h1>Berries</h1>
  <div class="row d-flex justify-content-between mb-5 principal-container" #container>
    <div class="col-4">
      <app-limit-selector [limit]="limit" (OnClick)="changeLimit($event)"/>
    </div>
  </div>
  @defer {
    <div class="row">
      @for (berry of berries?.results; track $index) {
          <app-card class="col-lg-4 col-md-4 col-12 mb-4" [poke]="berry"/>
      }@empty {
        <div class="col-12 d-flex justify-content-center">
          <div class="spinner-grow" style="width: 5rem; height: 5rem;" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      }
    </div>
    @if(berries?.results){
      <app-pagination
          [totalItems]="totalResults"
          [currentPage]="currentPage"
          [itemsPerPage]="limit"
          (OnClick)="changePage($event)"
      ></app-pagination>
    }
  } @placeholder (minimum 500ms) {
    <div class="row">
      <app-skeleton
        class="col-12"
        [count]="24"
        [theme]="[
          { width: '20px' },
          { width: '60%' },
          { width: '70%' }
        ]"/>
    </div>
  }
</div>
